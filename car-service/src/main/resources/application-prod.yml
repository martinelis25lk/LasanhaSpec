spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false        # ← desliga SQL no console em prod
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO                                    # ← só INFO acima
    br.com.lasanhaspec: INFO                      # ← seu pacote
    org.hibernate.SQL: OFF                        # ← sem SQL no log
    org.springframework.security: WARN            # ← menos verbose