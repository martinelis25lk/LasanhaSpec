name: Deploy LasanhaSpec

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Testar Car Service
        run: |
          cd car-service
          mvn test

      - name: Testar Market Service
        run: |
          cd market-service
          mvn test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/LasanhaSpec
            git pull origin main
            
            # 1. Atualizar e subir os containers Docker (Backend/DB)
            docker compose up -d --build
            docker image prune -f

            # 2. Gerar o build do Frontend e copiar para o Nginx
            cd /home/ubuntu/LasanhaSpec/frontend
            npm install
            npm run build
            sudo cp -r dist/* /var/www/lasanhaspec/
            sudo systemctl reload nginx